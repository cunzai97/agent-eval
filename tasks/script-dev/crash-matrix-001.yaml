id: crash-matrix-001
title: VRAM 崩溃预测器 + 从 changelog 定位取整修复（混合）
category: script-dev
tags: [planning, simulation, archaeology]
difficulty: hard
environment: {name: code_repo, snapshot: crash_matrix}
agent:
  system_prompt: |
    两件事：① 按 spec.md 实现 crashsim/predictor.py 的 predict（页数向上取整 + 阈值判定）；
    ② 读 docs/CHANGELOG.md，定位真正修复"长序列静默超卡崩溃"的那一条变更，用 answer 提交。
    先读规格与可见测试，实现后跑测试。changelog 里有相似但无关的干扰项，别认错。
  tools: [list_files, read_file, grep, edit_file, run_tests, answer, done]
task_prompt: |
  crashsim/predictor.py 目前是空壳（predict 抛 NotImplementedError）。请严格按 spec.md 实现
  predict(length, block, quant_bits, card_vram_bytes, base_bytes, threshold) -> {"vram_bytes", "crash"}：
  页数=ceil(length/block)（最后一块不满也按整块），vram=base+页数*block*quant_bits，
  crash=(vram/card)>=threshold。
  然后读 docs/CHANGELOG.md，找到修复"分页 KV cache 未向上取整页数导致长序列静默超卡崩溃"的
  那条变更，用 answer 提交单行 JSON {"version": "...", "fix": "..."}，fix 从
  ceil-page-count / logits-fp16 / allreduce-buffer 中选。不要改 tests/ 与 spec.md，实现后跑测试。
budget: {max_steps: 30, max_tokens: 64000, timeout_s: 900}
success:
  - type: state_assert
    expr: "state.test_report.failed == 0 and state.test_report.errors == 0 and state.test_report.passed >= 1"
  - type: state_assert
    expr: "state.hidden_tests.applicable and state.hidden_tests.total >= 5 and state.hidden_tests.passed == state.hidden_tests.total"
  - type: state_assert
    expr: "all(not str(p).startswith('tests/') for p in state.files_changed)"
  - type: state_assert
    expr: "'crashsim/predictor.py' in state.files_changed"
  - type: state_assert
    expr: "state.answer_json.get('fix')=='ceil-page-count' and '2.7.1' in str(state.answer_json.get('version',''))"
  - type: state_assert
    expr: "'docs/CHANGELOG.md' in state.files_read"
  - type: tool_used
    name: run_tests
  - type: tool_used
    name: answer
