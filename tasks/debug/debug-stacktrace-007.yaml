id: debug-stacktrace-007
title: 修复 Checkpoint 恢复后的异步 MTP 生命周期
category: debug
tags: [planning, state-tracking, recovery]
difficulty: hard
environment: {name: code_repo, snapshot: debug-007}
agent:
  system_prompt: |
    你是推理运行时工程师。先运行测试复现，再修复源码。禁止修改 tests/。
    所有测试全绿后调用 done。
  tools: [list_files, read_file, grep, edit_file, run_tests, done]
task_prompt: |
  异步 speculative/MTP worker 在首个请求正常，但生成结束后，若下个 prompt 从 checkpoint 的
  非零位置恢复，会把 prompt ubatch 当成 generation-local 行处理；旧队列/失败标记也可能污染
  同一 slot 的新请求。仅把 checkpoint 间距调大不能解决问题。

  请修复 server/ 到 speculative/ 的生命周期：server 必须对每个新 prompt（包括非零恢复）
  显式发出 prompt_begin；worker 应按 sequence 重置并清理旧异步状态，prompt 使用绝对位置，
  prompt 完成后才切换到 generation-local；取消不得影响其他 sequence。

  修复应支持连续请求、非零恢复、失败恢复和多 slot 隔离。不要用 pos == 0 推断请求边界。
budget: {max_steps: 38, max_tokens: 64000, timeout_s: 900}
success:
  - type: state_assert
    expr: "state.test_report['failed'] == 0 and state.test_report['errors'] == 0 and state.test_report['passed'] >= 9"
  - type: state_assert
    expr: "state.hidden_tests.applicable and state.hidden_tests.total >= 17 and state.hidden_tests.passed == state.hidden_tests.total"
  - type: state_assert
    expr: "all(not str(p).startswith('tests/') for p in state.files_changed)"
  - type: state_assert
    expr: "'server/scheduler.py' in state.files_changed and 'speculative/worker.py' in state.files_changed"
  - type: tool_used
    name: run_tests
  - type: order_of
    tools: [edit_file, run_tests]
