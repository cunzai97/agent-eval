id: locate-bug-005
title: 跨 repository/cache/service 隔离租户身份缺失（V3）
category: locate
tags: [planning, state-tracking]
difficulty: hard
environment: {name: code_repo, snapshot: locate-005}
agent:
  system_prompt: |
    先复现顺序相关污染，再用搜索确认谁直接调用了缺陷身份构造，沿 repository/cache/service
    链路定位首次丢失租户身份的定义点；不要修改代码。用 answer 提交结构化证据后 done。
  tools: [list_files, read_file, grep, run_tests, answer, done]
task_prompt: |
  两个租户单独读取相同 item_id 都正确；同一进程连续读取时，第二个租户得到第一个租户的数据。
  repository 的复合键、cache 的读写与清理、service 的闭包以及身份构造都可能造成这一表象。
  不要把门面调用者或传播错误的中间层当作根因；请定位首次把两个业务实体折叠成同一缓存身份
  的定义点，禁止修改代码。

  decoy 不是可选项：请指名排除过程中那个“看起来正是根因”的近邻——直接调用上述定义点、
  把错误命中结果缓存并原样传播下去、自身实现并不引入错误的那一层。入口 service 函数和
  本身已正确使用复合键的 repository 都不算 decoy。

  必须运行完整测试，并用 grep 至少搜索两次（一次定位嫌疑符号的定义处，一次定位它的调用处），
  至少阅读 4 个文件确认调用链，禁止修改代码。

  用 answer 提交单行 JSON，只能包含 file、symbol、cause、decoy 四个键。
  cause 从以下代码选择：omits-tenant、returns-shared-mutable-object、repository-key-collision。
  decoy 从以下符号名选择：load_item、get、fetch、clear。
budget: {max_steps: 30, max_tokens: 64000, timeout_s: 900}
success:
  - type: state_assert
    expr: "state.answer_json == {'file': 'mem/identity.py', 'symbol': 'cache_key', 'cause': 'omits-tenant', 'decoy': 'get'}"
  - type: state_assert
    expr: "all(path in state.files_read for path in ['mem/identity.py', 'mem/cache.py'])"
  - type: state_assert
    expr: "state.grep_calls >= 1 and state.test_runs >= 1"
  - type: state_assert
    expr: "state.files_changed == []"
  - type: tool_used
    name: run_tests
  - type: tool_used
    name: grep
  - type: tool_used
    name: read_file
  - type: tool_used
    name: answer
# rubric 已删除（2026-09-21 裁定：确定性的东西不需要裁判）。
# 这份细则原本索要的东西，下面的确定性判据已经逐条覆盖：答案键、必读文件、测试与 grep
# 证据、产物精确数值。实测它作为闸门的总贡献是 345 次判词里翻转 1 次，而那 1 次翻转考的
# 是『读过几个文件』的宽度——§10.9 已裁定过程宽度不当能力代理。
