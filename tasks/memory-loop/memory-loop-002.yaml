id: memory-loop-002
title: 用测试证据推翻并修正错误根因记忆
category: memory-loop
tags: [planning, recovery, state-tracking, constraint]
difficulty: hard
environment: {name: memory_code_repo, snapshot: memory-code-002}
agent:
  system_prompt: |
    你是维护长期工程资产的资深开发者。遵循统一记忆闭环规范：任务开始时主动检索并核验相关持久记忆；把记忆视为待验证假设；
    任务完成前必须闭合记忆，且一次任务只允许一次记忆变更：新验证的结论若是对已有条目的更正（旧记忆已被证据推翻），
    用 memory_update 原位改写那一条，不得再另写一条与之并存的新条目；只有记忆里本来没有对应条目时才用 memory_write 新建；
    除这一次变更外不得再记录其他记忆条目。完成闭环后再 done。
    禁止修改 tests/，必须用完整测试验证修复。
  tools: [memory_search, list_files, read_file, grep, edit_file, run_tests, memory_write, memory_update, done]
task_prompt: |
  profile 服务出现顺序相关故障：租户 a 的 u1 读取后，租户 b 的同名 u1 会拿到 a 的资料；单独读取任一租户正常。
  请沿 handler、service 与 cache 调用链复现并修复根因，保持公开接口，禁止修改测试，最终运行完整测试确认无回归。
budget: {max_steps: 34, max_tokens: 64000, timeout_s: 900}
success:
  - type: state_assert
    expr: "state.test_report.failed == 0 and state.test_report.errors == 0 and state.test_report.passed == 6"
  - type: state_assert
    expr: "state.files_changed == ['cache/key.py']"
  - type: state_assert
    expr: "all(text in state.memory.by_key['profile:tenant-leak-root-cause'].content for text in ['cache/key.py', 'tenant_id', 'user_id'])"
  - type: state_assert
    expr: "state.memory.by_key['profile:tenant-leak-root-cause'].version == 2 and len(state.memory.by_key['profile:tenant-leak-root-cause'].last_correction_reason) >= 4"
  - type: state_assert
    expr: "state.memory.metrics.search_calls >= 1 and state.memory.metrics.update_calls == 1 and state.memory.metrics.write_calls == 0"
  - type: tool_used
    name: memory_search
  - type: tool_used
    name: memory_update
  - type: tool_used
    name: run_tests
# 保留裁判的唯一理由：数字与记忆的**来源**无法从终态判定——产物数字全对，可能是脚本算
# 出来的，也可能是硬编码或对 read_file 片段的小样本估算。judge_id 把尺钉死在这里：
# 换裁判档案=换评分标准，实跑与它不符时该次判定记『未评』。
# N1（扰动输入后复算同一脚本）建成之后，这一档裁判就该被它替换掉并删除。
judge_id: luna-6:gpt-6-luna
rubric: |
  维度：
  - evidence_grounding：修正后的根因记忆是否由代码阅读和修复前后完整测试共同支撑，而非猜测。
  - correction_quality：是否明确说明旧记忆哪里错误、正确根因是什么，以及为什么应原位修正。
  - reuse_value：新记忆是否包含未来排查同类跨租户缓存污染所需的文件、身份维度和验证结果。
  判定要求：三个维度都充分且没有与轨迹证据冲突时 pass；遗漏关键证据为 partial；记忆与证据冲突或制造重复冲突记忆时 fail。
